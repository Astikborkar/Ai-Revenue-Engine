services:
  # FastAPI Backend Web Service (100% Free Instance)
  - type: web
    name: ai-revenue-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -r backend/requirements.txt; fi"
    startCommand: "if [ -f app/main.py ]; then uvicorn app.main:app --host 0.0.0.0 --port $PORT; else uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT; fi"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Next.js Frontend Web Service (100% Free Instance)
  - type: web
    name: ai-revenue-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "if [ -f package.json ]; then npm install && npm run build; else cd frontend && npm install && npm run build; fi"
    startCommand: "if [ -f package.json ]; then npm run start; else cd frontend && npm run start; fi"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ai-revenue-backend
          property: host
